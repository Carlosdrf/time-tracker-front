<div class="section">
  <div class="px-1">
    <app-entries-panel
      [entryCheck]="entryCheck"
      [currentEntryId]="currentEntryId"
      [start_time]="start_time"
      [entry]="startedEntry"
      (end_entry)="endCurrentEntry($event)"
      (start_entry)="addEntry($event)"
    ></app-entries-panel>
  </div>
  <app-dashboard-lib
    [components]="components"
    [entriesAlert]="entriesAlert"
  ></app-dashboard-lib>
</div>
