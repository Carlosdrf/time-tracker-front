<app-go-back></app-go-back>
<div class="card rounded shadow mb-2">
  <div class="card-header py-1">
    <div class="d-flex justify-content-between align-items-center">
      <!-- <h5
        class="title mb-0 p-2"
        *ngIf="
          user != null && user.id !== null && (role === '1' || role === '3')
        "
      >
        Report: {{ user.name }} {{ user.last_name }}
      </h5> -->
      <!-- <h5
        class="title mb-0 p-2"
        *ngIf="user.id == null && (role === '1' || role === '3')"
      >
        Report: Your Team
      </h5> -->
      <h5
        class="title mb-0 p-2"
        *ngIf="user.id == null && role === '2'; else genericReport"
      >
        Your Reports:
      </h5>
      <ng-template #genericReport> Reports: {{ displayNameIfAny() }}</ng-template>
      <div class="d-flex justify-content-end flex-wrap">
        <button
          mat-raised-button
          class="m-1 btn-hover transition"
          color="primary"
          id="content"
          (click)="toggleCalendar()"
        >
          <i class="fa-regular fa-calendar"></i>
          <span class="ms-2">Calendar</span>
        </button>
        <a
          mat-raised-button
          color="primary"
          type="submit"
          class="text-decoration-none m-1 btn-hover transition"
          (click)="downloadReport()"
          ><span><i class="fa-solid fa-download"></i></span
        ></a>
      </div>

      <!-- <a
        routerLink="/admin/entries"
        *ngIf="
          user.id !== null &&
          role === '1' &&
          user.company == null &&
          selectedUser
        "
        class="mb-0 links"
        ><span>See Entries</span></a
      > -->
    </div>
    <div class="calendar" id="content" *ngIf="isActive == true">
      <app-calendar
        (rangeSelection)="setDatesGroup($event)"
        (getEntries)="getEntries()"
        [datesRange]="datesRange"
        [calendar]="calendarHead"
      ></app-calendar>
    </div>
  </div>
  <div class="py-2 px-1 card-body">
    <div
      class="d-flex flex-wrap justify-content-between align-items-center gap-1"
    >
      <!-- filter options -->
      <div class="px-2">
        <app-reports-filter
          (onSelectedFilters)="handleSelection($event)"
        ></app-reports-filter>
        <!-- <app-user-options
          (onSelectUserId)="filterByUser($event)"
          (onSelectProjectId)="filterByProject($event)"
          (onGetEntries)="getEntries()"
        ></app-user-options> -->
      </div>
    </div>
  </div>
</div>
<div class="card rounded shadow">
  <div class="card-header">
    <div class="row">
      <p class="mb-0">{{ calendarHead }}</p>
    </div>
  </div>
  <div class="card-body">
    <div class="chart">
      <canvas id="myChart"></canvas>
    </div>
  </div>
</div>
