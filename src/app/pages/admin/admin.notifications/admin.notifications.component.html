<div class="d-flex position-relative z-1 ">
  <div class="col-sm-5 col-12"> 
        <div class="d-flex justify-content-between col-12 flex-lg-row flex-column mb-4">
          <div class="d-flex align-items-center p-1">
            <h2 class="mb-0">Notifications</h2>
        </div>
        <a
          (click)="userToggle()"
          color="primary"
          mat-raised-button
          class="btn p-2 px-3 fs-5 w-75"
          ><mat-icon>add</mat-icon>New Notification</a
        >
      </div>
    <app-notifications></app-notifications>
</div>
<div
  class="position-fixed d-flex justify-content-center align-items-center col-12 bottom-0 end-0 top-0 start-0 z-n1"
>
  <div
    class="position-absolute bottom-0 end-0 col-8 col-sm-6 d-flex justify-content-center"
  >
    <img
      class="col-10 col-sm-8 px-2"
      src="./assets/images/resources/maintenance-resource.png"
      alt=""
      srcset=""
    />
  </div>
</div>
<div
  class="slide col-sm-7 col-12 position-fixed top-0 end-0 start-sm-0 bottom-0 d-flex justify-content-center align-items-center z-1"
  #appUser
  [ngClass]="{ 'slide-in': isSlideIn, 'slide-out': !isSlideIn }"
>
  <div class="col-9 vh-100 col-sm-10 position-relative">
    <main class="h-100 d-flex flex-column justify-content-center">
      <div class="rounded shadow text-center card max-h-75 mt-5">
        <div class="card-header">
          <h1 class="mb-0 text-dark fs-3">New Notification</h1>
        </div>
        <div class="card-body">
         <form action=""
         [formGroup]="notificationForm"
         (ngSubmit)="submitNotificationForm()"
        >
            <!-- Message input -->
            <div class="mb-3 text-start">
              <label for="messageInput" class="form-label">Message</label>
              <textarea 
                class="form-control" 
                formControlName="message"
                id="messageInput" 
                style="height: 120px;  resize: none;">
            </textarea>
            </div>

            <!-- Users select -->
            <div class="mb-3 text-start">
              <label for="usersInput" class="form-label">Users</label>
              <mat-form-field class="w-100" lass="bg-info">
                <mat-label>Select Users</mat-label>
                <mat-select formControlName="selectedUsers" multiple>
                  @for (users of usersList; track users) {
                    <mat-option [value]="users"> {{users.name}} {{users.last_name}}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </div>

            <!-- <div class="form-check form-switch d-flex justify-content-end gap-3">
              <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault"  [(ngModel)]="isCreateLater" (click)="toggleCreateLater()">
              <label class="form-check-label" for="flexSwitchCheckDefault">Send at a later date</label>
            </div> -->

          <div class="d-flex gap-2" *ngIf="isCreateLater">
              <!-- Calendar input -->
              <div class="mb-3 col-6 d-flex flex-column text-start">
                <label for="timeInput" class="form-label">Date</label>
                <mat-form-field>
                  <mat-label>Choose a date</mat-label>
                  <input matInput [matDatepicker]="picker">
                  <mat-hint>MM/DD/YYYY</mat-hint>
                  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
              </div>

              <!-- Time input -->
              <div class="mb-3 col-6 d-flex flex-column text-start">
                <label for="timeInput" class="form-label">Time</label>
                <!-- <input type="time" class="form-control" id="timeInput" /> -->
                <mat-form-field>
                  <input type="time" matInput>
                  <!-- <mat-icon matSuffix>access_time</mat-icon> -->
                </mat-form-field>
              </div>
          </div>

            <div class="d-flex justify-content-end mt-4">
            <!-- <a
              (click)="sendNotification()"
              color="primary"
              mat-raised-button
              class="btn p-2 px-3 fs-5"
              ><mat-icon>send</mat-icon>Send</a
            > -->
            <button
            color="primary"
            mat-raised-button
            class="btn btn-primary btn-block btn-hover transition rounded px-4 ms-2"
          >
            <mat-icon>send</mat-icon>Send
          </button>
          </div> 
         </form>      
        </div>
      </div>
    </main>
  </div>
</div>
