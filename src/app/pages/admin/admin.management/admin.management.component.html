<div class="d-flex justify-content-between flex-wrap position-relative">
  <div class="col-12 col-sm-6 col-md-5 px-1 mb-2">
    <div class="border shadow rounded overflow-hidden cursor-pointer">
      <div *ngFor="let option of options; let i = index" class="transition">
        <div
          (click)="handleSelection(i)"
          [ngClass]="{ active: option.active }"
          class="d-flex align-items-center card-hover justify-content-between gap-2 p-3 border-top border-bottom"
        >
          <div class="d-flex align-items-center justify-content-between">
            <h2 [title]="option.label" class="mb-0 fs-5">
              {{ option.title }}
            </h2>
            <button
              mat-button
              class="ms-2"
              (click)="resetForm(true)"
              [title]="'New ' + option.formGroup"
            >
              <i class="fa-solid fa-plus cursor-pointer"></i>
              <span class="ms-1">New</span>
            </button>
          </div>
          <i class="fa-solid fa-angle-right"></i>
        </div>
        <div class="max-height i-flow">
          <div
            *ngFor="let select of option.select"
            class="border-bottom transition dropdown overflow-hidden"
            [ngClass]="{ active: option.active }"
          >
            <div
              class="px-3 py-2 card-hover d-flex gap-2"
              [ngClass]="{ active: selectedForm == select }"
              (click)="handleSelection(i, select)"
            >
              <input
                type="checkbox"
                class="form-check-input"
                [checked]="selectedForm == select"
              />
              <p class="mb-0 col-9 col-sm-10">
                {{ select.title || select.name }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div
    class="col-12 col-sm-6 col-md-7 px-1 mb-2 sticky-md-top h-100 z-1 d-sm-block d-none"
    [ngClass]="{
      'position-modal': isMobile() && show
    }"
    style="top: 80px"
  >
    <div class="border shadow bg-white overflow-hidden rounded card">
      <div
        class="card-header d-flex justify-content-sm-center justify-content-between align-items-center"
      >
        <h1 class="mb-0 text-center fs-4">
          {{ formHeader.mode }} {{ formHeader.title }}
        </h1>
        <button
          mat-button
          class="hidden-sm d-sm-none border"
          (click)="resetForm(); show = false"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="card-body">
        <form
          action=""
          [formGroup]="managementForm"
          *ngFor="let option of options"
          (ngSubmit)="sendForms(option)"
        >
          <div
            class=""
            formGroupName="{{ option.formGroup }}"
            *ngIf="option.active"
          >
            <div *ngFor="let form of option.form">
              <input
                *ngIf="option.active"
                type="text"
                [placeholder]="
                  form.label == 'Description'
                    ? 'Short ' + form.label + ' (optional)'
                    : form.label
                "
                formControlName="{{ form.control }}"
                class="form-control rounded mb-2 py-2"
                placeholder="Input"
              />
            </div>
            <div class="d-flex flex-end gap-2 justify-content-end">
              <a
                color="warn"
                (click)="deleteOption(selectedForm.id, option)"
                class="btn btn-block"
                mat-raised-button
                *ngIf="selectedForm"
                >delete</a
              >
              <button
                mat-raised-button
                class="btn-primary transition"
                color="primary"
              >
                Save
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
