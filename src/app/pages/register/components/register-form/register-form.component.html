<form
  [formGroup]="registerForm"
  class="border rounded-5 shadow p-4 text-center mt-2"
  (submit)="handleSubmit()"
>
  <div *ngFor="let field of fields; let i = index" class="mb-4 d-flex gap-2">
    <div class="px-3 d-flex align-items-center rounded-circle bg-dark">
      <span class="rounded-circle text-white fs-3 montserrat-custom-font">{{
        i + 1
      }}</span>
    </div>
    <input
      *ngIf="field.type == 'text'"
      type="text"
      class="w-10s0 form-control border rounded-5"
      placeholder="{{ field.label }}"
      formControlName="{{ field.control }}"
    />
    <select
      *ngIf="field.type == 'select'"
      name="{{ field.label }}"
      id=""
      class="form-select border rounded-5"
      formControlName="{{ field.control }}"
    >
      <option value="" disabled>{{ field.label }}</option>
      <option *ngFor="let option of field.options" [value]="option">
        {{ option }}
      </option>
    </select>
    <input
      accept="application/pdf"
      *ngIf="field.type == 'file'"
      type="file"
      name=""
      (change)="onFileChange($event)"
      id=""
      class="form-control rounded-5 border"
    />
  </div>
  <div class="position-relative mb-2 mt-5">
    <button mat-raised-button color="primary" class="rounded-5 p-2 px-5 fw-bold fs-4">
      Send
    </button>
    <app-loader
      class="position-absolute start-0 bottom-0 top-0"
      [loader]="loader"
      [diameter]="48"
    ></app-loader>
  </div>
  <p
    [ngClass]="{ 'text-danger': formStatus.isInvalid }"
    *ngIf="formStatus.isInvalid || formStatus.message"
  >
    {{ formStatus.message }}
  </p>
</form>
