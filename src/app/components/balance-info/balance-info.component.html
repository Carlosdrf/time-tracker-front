<mat-grid-list cols="3" rowHeight="9rem" gutterSize="16px">
    <mat-grid-tile *ngFor="let card of cards" [colspan]="getColspan()" [rowspan]="1">
      <mat-card class="balance-info-card">
        <mat-card-header>
          <mat-card-title>
            <h4 class="mb-0">{{ card.title }}:</h4>
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="{{card.icon}}"></mat-icon>
            {{ card.title == 'Transaction count' ? card.content : card.content | currency: 'USD' }}
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
