<nav
  class="navbar navbar-expand-lg p-1 px-2 border shadow bg-light fixed-top bg-body-tertiary"
>
  <div class="container-fluid px-3">
    <a class="navbar-brand" routerLink="/">
      <img src="assets/images/inimble.png" width="150" alt="" />
    </a>
    <button
      class="navbar-toggler rounded"
      type="button"
      data-bs-toggle="collapse"
      (click)="toggleMenu()"
      data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse justify-content-end"
      [ngClass]="{ show: isActive }"
      id="navbarNavAltMarkup"
    >
      <div class="navbar-nav align-items-center">
        <!-- admin dashboard -->
        <a
          class="nav-link"
          routerLink="admin/"
          *ngIf="authenticated == true && userType == '1'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Dashboard</a
        >
        <a
          class="nav-link"
          routerLink="admin/users"
          *ngIf="authenticated == true && userType == '1'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Users</a
        >
        <a
          class="nav-link"
          routerLink="admin/teams"
          *ngIf="authenticated == true && userType == '1'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Tracker</a
        >
        <!-- user dashboard -->
        <a
          class="nav-link"
          routerLink="dashboard"
          *ngIf="authenticated == true && userType == '2'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Dashboard</a
        >
        <a
          class="nav-link"
          routerLink="entries"
          *ngIf="authenticated == true && userType == '2'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Entries</a
        >
        <!-- client dashboard -->
        <a
          class="nav-link"
          routerLink="client"
          *ngIf="authenticated == true && userType == '3'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Dashboard</a
        >
        <a
          class="nav-link"
          routerLink="reports"
          *ngIf="authenticated"
          (click)="isActive = false; clearSelectedUser()"
          routerLinkActive="active"
          >Reports</a
        >
        <a
          class="nav-link"
          routerLink="client/projects"
          *ngIf="authenticated == true && userType == '3'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Projects</a
        >
        <a
          class="nav-link"
          routerLink="client/balance"
          *ngIf="authenticated == true && userType == '3'"
          (click)="isActive = false"
          routerLinkActive="active"
          >Invoices</a
        >
        <a
          class="nav-link"
          routerLink="login"
          *ngIf="!authenticated"
          (click)="isActive = false"
          routerLinkActive="active"
          >Login</a
        >
        <a
          class="nav-link"
          routerLink="logout"
          *ngIf="authenticated"
          (click)="isActive = false; closeSession()"
          routerLinkActive="active"
          >Log Out</a
        >
      </div>
    </div>
  </div>
</nav>
