<h2 mat-dialog-title>Create a Company Express!</h2>
<mat-dialog-content>
  <div class="d-flex flex-column" [formGroup]="companyForm">
    <ng-container *ngFor="let form of companyFields">
      <mat-form-field *ngIf="form.type == 'text'">
        <mat-label>{{ form.label }}</mat-label>
        <input matInput formControlName="{{ form.control }}" />
      </mat-form-field>
      <mat-form-field *ngIf="form.type == 'select'">
        <mat-label>{{ form.label }}</mat-label>
        <input
          matInput
          formControlName="{{ form.control }}"
          [matAutocomplete]="auto"
          (keyup)="search(companyForm.get(form.control)?.value)"
        />
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option
            *ngFor="let timezone of timezones"
            value="{{ timezone.zoneName }}:{{ timezone.countryCode }}"
            >{{ timezone.fechaActual }} {{ timezone.zoneName }}</mat-option
          >
        </mat-autocomplete>
      </mat-form-field>
    </ng-container>
  </div>
</mat-dialog-content>
<mat-dialog-actions class="d-flex flex-end">
  <button
    mat-button
    class="ms-2 rounded shadow px-4 py-1 btn btn-primary"
    [mat-dialog-close]="companyForm.value"
    [disabled]="!validForm"
  >
    Yes
  </button>
  <button
    mat-button
    class="ms-2 rounded shadow px-4 py-1 btn btn-danger"
    [mat-dialog-close]="false"
  >
    Cancel
  </button>
</mat-dialog-actions>
